[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-solidify"
version = "0.1.1"
description = "Turn broken meshes (holes, open shells, self-intersections) into one watertight, printable solid."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jake Mathews" }]
keywords = ["mesh", "stl", "3d-printing", "watertight", "mesh-repair", "winding-number", "remesh"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
  "Environment :: Console",
]
dependencies = [
  "numpy", "scipy", "scikit-image", "trimesh", "libigl>=2.6",
  "pymeshlab", "manifold3d", "lxml", "rtree",
]

[project.scripts]
mesh-solidify = "solidify:main"

[project.urls]
Homepage = "https://github.com/JakeMathews/mesh-solidify"
Issues = "https://github.com/JakeMathews/mesh-solidify/issues"

[tool.setuptools]
py-modules = ["solidify"]
