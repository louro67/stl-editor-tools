name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all 
      - run: cargo clippy --workspace --exclude solidcraft-mesh-solidify --all-targets -- -D warnings
      - run: cargo clippy -p solidcraft-mesh-solidify --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --release --workspace --exclude solidcraft-mesh-solidify
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      - name: Build the SolidCraft plugin
        run: ./scripts/build-plugin.sh
