name: Release

# Push a tag like v0.2.0 to build every artifact and attach it to that tag's GitHub release
# (the release is created if it doesn't exist yet).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-14, target: x86_64-apple-darwin, ext: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p mesh-solidify-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=mesh-solidify-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/mesh-solidify${{ matrix.ext }} README.md LICENSE "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: mesh-solidify-*.*z*

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-tools --locked
      - run: ./scripts/build-plugin.sh
      - name: Skill and Python packages
        run: |
          (cd skills && zip -qr ../dist/mesh-solidify-skill.zip mesh-solidify)
          cp python/solidify.py dist/solidify.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            dist/mesh-solidify-plugin.zip
            dist/mesh-solidify-skill.zip
            dist/solidify.py

  publish:
    needs: [cli, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" * --clobber
